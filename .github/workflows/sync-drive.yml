name: Sync Google Drive to GitHub

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync-drive:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install google-auth google-auth-httplib2 google-api-python-client
      
      - name: Create service account credentials file
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}' > /tmp/service-account.json
      
      - name: Sync files from Google Drive
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          python3 << 'EOF'
          import os
          import io
          import json
          import hashlib
          from pathlib import Path
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload

          SCOPES = ['https://www.googleapis.com/auth/drive.readonly']
          BASE_DIR = Path('images/drive')

          def get_file_hash(filepath):
              if not os.path.exists(filepath):
                  return None
              hash_md5 = hashlib.md5()
              with open(filepath, "rb") as f:
                  for chunk in iter(lambda: f.read(4096), b""):
                      hash_md5.update(chunk)
              return hash_md5.hexdigest()

          def download_file(service, file_id, destination_path):
              request = service.files().get_media(fileId=file_id)
              destination_path.parent.mkdir(parents=True, exist_ok=True)
              fh = io.BytesIO()
              downloader = MediaIoBaseDownload(fh, request)
              done = False
              while not done:
                  status, done = downloader.next_chunk()
                  if status:
                      print(f"  Progreso: {int(status.progress() * 100)}%")
              with open(destination_path, 'wb') as f:
                  fh.seek(0)
                  f.write(fh.read())

          def list_files_in_folder(service, folder_id, current_path=''):
              query = f"'{folder_id}' in parents and trashed=false"
              results = service.files().list(
                  q=query,
                  pageSize=1000,
                  fields="files(id, name, mimeType, md5Checksum)"
              ).execute()
              items = results.get('files', [])
              
              for item in items:
                  item_name = item['name']
                  item_id = item['id']
                  mime_type = item['mimeType']
                  relative_path = os.path.join(current_path, item_name)
                  
                  if mime_type == 'application/vnd.google-apps.folder':
                      print(f"📁 Carpeta: {relative_path}")
                      list_files_in_folder(service, item_id, relative_path)
                  else:
                      local_path = BASE_DIR / relative_path
                      should_download = True
                      
                      if local_path.exists():
                          drive_md5 = item.get('md5Checksum')
                          local_md5 = get_file_hash(local_path)
                          if drive_md5 and local_md5 and drive_md5 == local_md5:
                              print(f"⏭️  Omitiendo (sin cambios): {relative_path}")
                              should_download = False
                          else:
                              print(f"🔄 Actualizando: {relative_path}")
                      else:
                          print(f"⬇️  Descargando nuevo: {relative_path}")
                      
                      if should_download:
                          try:
                              download_file(service, item_id, local_path)
                              print(f"✅ Completado: {relative_path}")
                          except Exception as e:
                              print(f"❌ Error descargando {relative_path}: {str(e)}")

          # Main execution
          folder_id = os.environ.get('DRIVE_FOLDER_ID')
          if not folder_id:
              raise ValueError("DRIVE_FOLDER_ID no está definido")
          
          print("🔐 Autenticando con Google Drive...")
          credentials = service_account.Credentials.from_service_account_file(
              '/tmp/service-account.json', scopes=SCOPES
          )
          service = build('drive', 'v3', credentials=credentials)
          
          print(f"📂 Sincronizando carpeta de Drive (ID: {folder_id})...")
          print(f"📍 Directorio destino: {BASE_DIR}\n")
          
          BASE_DIR.mkdir(parents=True, exist_ok=True)
          list_files_in_folder(service, folder_id)
          
          print("\n✨ Sincronización completada")
          EOF
      
      - name: Clean up credentials
        if: always()
        run: |
          rm -f /tmp/service-account.json
      
      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      
      - name: Commit and push changes
        run: |
          git add images/drive/
          if git diff --staged --quiet; then
            echo "No hay cambios para commitear"
          else
            git commit -m "Sync: Update files from Google Drive [$(date +'%Y-%m-%d %H:%M:%S')]"
            git push origin main
          fi